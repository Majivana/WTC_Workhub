spring:
  application:
    name: wtc-workhub
  profiles:
    default: local

management:
  endpoints:
    web:
      exposure:
        include: health,info
  endpoint:
    health:
      probes:
        enabled: true

server:
  error:
    include-message: never

app:
  storage:
    provider: ${WTC_STORAGE_PROVIDER:local}
    s3:
      bucket: ${WTC_S3_BUCKET:}
      region: ${AWS_REGION:af-south-1}
      presign-minutes: ${WTC_S3_PRESIGN_MINUTES:10}
